name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify no INTERNET permission
        run: |
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt2 | sort -r | head -1)
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          echo "--- permissions ---"
          $AAPT dump permissions "$APK"
          if $AAPT dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::APK declares INTERNET permission. This project is offline-only."
            exit 1
          fi
          echo "OK: no INTERNET permission"

      - name: Verify dictionary packaged
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          unzip -l "$APK" | grep -E "assets/dict/(chars|words)\.txt" || { echo "::error::dictionary missing from APK"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wuyou-ime-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
